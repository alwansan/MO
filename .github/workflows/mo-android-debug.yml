name: MO Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/mo-android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mo-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu hosted runner already ships the Android command-line SDK.
      # android-actions/setup-android@v3 currently asks sdkmanager for
      # obsolete package "tools" and fails before compilation.
      - name: Use runner Android SDK and install API 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "SDK=$SDK_ROOT  sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee mo-debug-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MO-Graphics-Probe-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            mo-debug-sha256.txt
          if-no-files-found: error
          retention-days: 14
