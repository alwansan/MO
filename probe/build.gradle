plugins {
    id 'com.android.application'
}
android {
    namespace 'com.alwansan.mo.glesprobe'
    compileSdk 35
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'com.alwansan.mo.glesprobe'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.5'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
